name: TaxOra CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend
        working-directory: ./backend/TaxBankingApi
        run: dotnet restore

      - name: Build backend
        working-directory: ./backend/TaxBankingApi
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        working-directory: ./backend/TaxBankingApi.Tests
        run: dotnet test --configuration Release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build