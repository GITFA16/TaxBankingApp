services:
  backend:
    build:
      context: ./backend/TaxBankingApi
      dockerfile: dockerfile

    container_name: taxora-backend

    ports:
      - "7131:8443"

    environment:
      ASPNETCORE_URLS: "https://+:8443"
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/taxbanking.db"
      ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/localhost+2.pem"
      ASPNETCORE_Kestrel__Certificates__Default__KeyPath: "/https/localhost+2-key.pem"

    volumes:
      - ./backend/TaxBankingApi/taxbanking.db:/app/data/taxbanking.db
      - ./localhost+2.pem:/https/localhost+2.pem:ro
      - ./localhost+2-key.pem:/https/localhost+2-key.pem:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile

    container_name: taxora-frontend

    ports:
      - "8081:80"

    depends_on:
      - backend